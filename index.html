<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod Classic</title>

  <!-- Meta Tags para iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iPod Classic">
  <meta name="theme-color" content="#121212">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #333;
    }

    /* Carcasas de Aluminio */
    .casing-silver { background: linear-gradient(145deg, #e6e6e6, #cccccc); }
    .casing-black  { background: linear-gradient(145deg, #2a2a2a, #141414); }
    .casing-blue   { background: linear-gradient(145deg, #3a7bd5, #3a6073); }
    .casing-purple { background: linear-gradient(145deg, #8e2de2, #4a00e0); }
    .casing-gold   { background: linear-gradient(145deg, #f7971e, #ffd200); }
    .casing-pink   { background: linear-gradient(145deg, #ff758c, #ff7eb3); }

    .wheel-shadow {
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.3);
    }

    .lcd-screen {
      background: #e0e8f0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    .menu-item-selected {
      background: linear-gradient(180deg, #3388e6 0%, #0055b3 100%);
      color: white;
    }

    /* Ocultar barra de scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-0">

  <!-- Estructura del iPod -->
  <div id="ipod-case" class="casing-silver w-[340px] h-[580px] rounded-[38px] p-6 flex flex-col justify-between shadow-2xl relative border border-white/20 transition-all duration-300">
    
    <!-- Pantalla LCD -->
    <div class="lcd-screen w-full h-[240px] rounded-lg border-2 border-gray-400/50 overflow-hidden flex flex-col relative text-gray-800">
      
      <!-- Barra Superior (Header) -->
      <div class="h-7 bg-gradient-to-b from-gray-200 to-gray-300 border-b border-gray-400 flex items-center justify-between px-3 text-xs font-semibold">
        <span id="screen-title" class="truncate max-w-[180px]">iPod</span>
        <div class="flex items-center space-x-2">
          <i id="play-status-icon" class="fas fa-pause text-[10px] hidden"></i>
          <i class="fas fa-battery-three-quarters text-xs text-gray-700"></i>
        </div>
      </div>

      <!-- Contenido Dinámico de Pantalla -->
      <div id="screen-content" class="flex-1 overflow-y-auto no-scrollbar relative">
        <!-- Rellenado por JS -->
      </div>
    </div>

    <!-- Rueda Click Wheel -->
    <div class="flex justify-center my-2">
      <div id="click-wheel" class="w-[210px] h-[210px] rounded-full bg-white wheel-shadow relative flex items-center justify-center cursor-pointer select-none">
        
        <!-- Botón MENU -->
        <button id="btn-menu" class="absolute top-3 font-bold text-gray-500 text-xs hover:text-black transition">MENU</button>
        
        <!-- Botón Anterior / Retroceder -->
        <button id="btn-prev" class="absolute left-4 text-gray-500 text-xs hover:text-black transition">
          <i class="fas fa-backward"></i>
        </button>
        
        <!-- Botón Siguiente / Adelantar -->
        <button id="btn-next" class="absolute right-4 text-gray-500 text-xs hover:text-black transition">
          <i class="fas fa-forward"></i>
        </button>
        
        <!-- Botón Play / Pausa -->
        <button id="btn-play" class="absolute bottom-3 text-gray-500 text-xs hover:text-black transition">
          <i class="fas fa-play"></i> <i class="fas fa-pause"></i>
        </button>
        
        <!-- Botón Central (Select) -->
        <div id="btn-center" class="w-[75px] h-[75px] rounded-full bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-300 active:scale-95 transition shadow-sm"></div>
      </div>
    </div>
  </div>

  <!-- Reproductor Oculto de YouTube para Audio -->
  <div class="hidden">
    <div id="youtube-player"></div>
  </div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // --- ESTADO DE LA APLICACIÓN ---
    const state = {
      menuHistory: [],
      currentMenu: 'main',
      selectedIndex: 0,
      playlist: JSON.parse(localStorage.getItem('ipod_playlist')) || [
        { title: 'Billie Jean', artist: 'Michael Jackson' },
        { title: 'Starboy', artist: 'The Weeknd' }
      ],
      currentTrackIndex: -1,
      isPlaying: false,
      theme: 'silver',
      player: null
    };

    // --- MENÚS ---
    const menus = {
      main: {
        title: 'iPod',
        items: [
          { label: 'Música', action: () => navigateTo('music') },
          { label: 'Añadir canción', action: () => navigateTo('addSong') },
          { label: 'Ajustes', action: () => navigateTo('settings') }
        ]
      },
      music: {
        title: 'Música',
        items: [
          { label: 'Todas las canciones', action: () => playCurrentPlaylist() },
          { label: 'Reproduciendo ahora', action: () => navigateTo('nowPlaying') }
        ]
      },
      settings: {
        title: 'Ajustes',
        items: [
          { label: 'Color: Plata', action: () => setTheme('silver') },
          { label: 'Color: Negro', action: () => setTheme('black') },
          { label: 'Color: Azul', action: () => setTheme('blue') },
          { label: 'Color: Púrpura', action: () => setTheme('purple') },
          { label: 'Color: Dorado', action: () => setTheme('gold') },
          { label: 'Color: Rosa', action: () => setTheme('pink') }
        ]
      }
    };

    // --- EFECTOS DE SONIDO WEB AUDIO API ---
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.015);
      } catch (e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(10);
    }

    // --- REPRODUCCIÓN VÍA YOUTUBE ---
    function onYouTubeIframeAPIReady() {
      state.player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        state.isPlaying = true;
        document.getElementById('play-status-icon').classList.remove('hidden');
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        state.isPlaying = false;
        document.getElementById('play-status-icon').classList.add('hidden');
        if (event.data === YT.PlayerState.ENDED) nextTrack();
      }
      if (state.currentMenu === 'nowPlaying') renderNowPlaying();
    }

    async function playTrack(index) {
      if (!state.playlist || state.playlist.length === 0) return;
      if (index < 0) index = state.playlist.length - 1;
      if (index >= state.playlist.length) index = 0;

      state.currentTrackIndex = index;
      const track = state.playlist[index];

      navigateTo('nowPlaying');

      const query = encodeURIComponent(`${track.title} ${track.artist} audio`);
      try {
        const res = await fetch(`https://www.youtube.com/results?search_query=${query}`);
        const html = await res.text();
        const videoIdMatch = html.match(/"videoId":"([a-zA-Z0-9_-]{11})"/);

        if (videoIdMatch && state.player && state.player.loadVideoById) {
          state.player.loadVideoById(videoIdMatch[1]);
        }
      } catch (e) {
        console.error('Error buscando track:', e);
      }
    }

    function togglePlay() {
      if (!state.player) return;
      if (state.isPlaying) {
        state.player.pauseVideo();
      } else {
        state.player.playVideo();
      }
    }

    function nextTrack() {
      playTrack(state.currentTrackIndex + 1);
    }

    function prevTrack() {
      playTrack(state.currentTrackIndex - 1);
    }

    // --- NAVEGACIÓN Y RENDERIZADO ---
    function navigateTo(menuKey) {
      if (menuKey === 'addSong') {
        renderAddSongScreen();
        return;
      }
      state.menuHistory.push({ menu: state.currentMenu, index: state.selectedIndex });
      state.currentMenu = menuKey;
      state.selectedIndex = 0;
      renderScreen();
    }

    function goBack() {
      if (state.menuHistory.length > 0) {
        const last = state.menuHistory.pop();
        state.currentMenu = last.menu;
        state.selectedIndex = last.index;
        renderScreen();
      }
    }

    function renderScreen() {
      if (state.currentMenu === 'nowPlaying') {
        renderNowPlaying();
      } else {
        renderMenu();
      }
    }

    function renderMenu() {
      const menu = menus[state.currentMenu];
      document.getElementById('screen-title').innerText = menu ? menu.title : 'iPod';
      const content = document.getElementById('screen-content');
      content.innerHTML = '';

      let items = menu ? menu.items : [];

      if (state.currentMenu === 'music' && state.playlist.length > 0) {
        items = state.playlist.map((t, i) => ({
          label: `${t.title} - ${t.artist}`,
          action: () => playTrack(i)
        }));
      }

      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `px-3 py-1.5 text-xs font-medium flex justify-between items-center cursor-pointer ${
          idx === state.selectedIndex ? 'menu-item-selected' : 'text-gray-800'
        }`;
        div.innerHTML = `
          <span class="truncate">${item.label}</span>
          <i class="fas fa-chevron-right text-[9px] opacity-70"></i>
        `;
        content.appendChild(div);
      });
    }

    function renderAddSongScreen() {
      document.getElementById('screen-title').innerText = 'Añadir canción';
      const content = document.getElementById('screen-content');
      content.innerHTML = `
        <div class="p-3 text-xs space-y-2">
          <p class="font-bold text-gray-700">Título de la canción:</p>
          <input type="text" id="song-title-input" placeholder="Ej. Despacito" 
                 class="w-full p-1.5 border rounded text-[11px] text-gray-800 bg-white focus:outline-none border-blue-400">
          <p class="font-bold text-gray-700">Artista:</p>
          <input type="text" id="song-artist-input" placeholder="Ej. Luis Fonsi" 
                 class="w-full p-1.5 border rounded text-[11px] text-gray-800 bg-white focus:outline-none border-blue-400">
          <button id="btn-save-song" class="w-full bg-blue-600 text-white py-1.5 rounded font-bold hover:bg-blue-700 transition mt-1">
            Guardar en el iPod
          </button>
        </div>
      `;

      setTimeout(() => {
        document.getElementById('btn-save-song').addEventListener('click', () => {
          const title = document.getElementById('song-title-input').value.trim();
          const artist = document.getElementById('song-artist-input').value.trim();
          if (title && artist) {
            state.playlist.push({ title, artist });
            localStorage.setItem('ipod_playlist', JSON.stringify(state.playlist));
            alert(`¡"${title}" añadida con éxito!`);
            navigateTo('music');
          } else {
            alert('Por favor, rellena ambos campos.');
          }
        });
      }, 50);
    }

    function renderNowPlaying() {
      document.getElementById('screen-title').innerText = 'Reproduciendo';
      const content = document.getElementById('screen-content');
      const track = state.playlist[state.currentTrackIndex] || { title: 'Sin canción', artist: 'Desconocido' };

      content.innerHTML = `
        <div class="p-3 flex flex-col items-center justify-between h-full text-center">
          <div class="w-20 h-20 bg-gray-300 rounded shadow-md flex items-center justify-center my-1 bg-gradient-to-tr from-gray-400 to-gray-200">
            <i class="fas fa-music text-3xl text-gray-600"></i>
          </div>
          <div class="w-full px-2">
            <p class="font-bold text-xs truncate text-gray-900">${track.title}</p>
            <p class="text-[11px] text-gray-600 truncate">${track.artist}</p>
          </div>
          <div class="w-full space-y-1 my-1">
            <div class="w-full bg-gray-300 h-1.5 rounded-full overflow-hidden">
              <div class="bg-blue-600 h-full w-1/3"></div>
            </div>
            <div class="flex justify-between text-[9px] text-gray-500">
              <span>Reproduciendo</span>
              <span>YouTube Audio</span>
            </div>
          </div>
        </div>
      `;
    }

    function setTheme(color) {
      state.theme = color;
      document.getElementById('ipod-case').className = `casing-${color} w-[340px] h-[580px] rounded-[38px] p-6 flex flex-col justify-between shadow-2xl relative border border-white/20 transition-all duration-300`;
    }

    // --- CONTROLES DE LA RUEDA ---
    let startAngle = 0;
    const wheel = document.getElementById('click-wheel');

    wheel.addEventListener('touchstart', (e) => {
      const rect = wheel.getBoundingClientRect();
      const touch = e.touches[0];
      startAngle = Math.atan2(touch.clientY - (rect.top + rect.height/2), touch.clientX - (rect.left + rect.width/2));
    });

    wheel.addEventListener('touchmove', (e) => {
      const rect = wheel.getBoundingClientRect();
      const touch = e.touches[0];
      const currentAngle = Math.atan2(touch.clientY - (rect.top + rect.height/2), touch.clientX - (rect.left + rect.width/2));
      const diff = currentAngle - startAngle;

      if (Math.abs(diff) > 0.4) {
        playClickSound();
        triggerHaptic();

        const menu = menus[state.currentMenu];
        const maxIndex = (state.currentMenu === 'music' && state.playlist.length > 0) ? state.playlist.length - 1 : (menu ? menu.items.length - 1 : 0);

        if (diff > 0) {
          state.selectedIndex = Math.min(state.selectedIndex + 1, maxIndex);
        } else {
          state.selectedIndex = Math.max(state.selectedIndex - 1, 0);
        }
        renderScreen();
        startAngle = currentAngle;
      }
    });

    document.getElementById('btn-center').addEventListener('click', () => {
      playClickSound();
      triggerHaptic();

      if (state.currentMenu === 'addSong') return;

      const menu = menus[state.currentMenu];
      if (state.currentMenu === 'music' && state.playlist.length > 0) {
        playTrack(state.selectedIndex);
      } else if (menu && menu.items[state.selectedIndex]) {
        menu.items[state.selectedIndex].action();
      }
    });

    document.getElementById('btn-menu').addEventListener('click', () => {
      playClickSound();
      triggerHaptic();
      goBack();
    });

    document.getElementById('btn-play').addEventListener('click', () => {
      playClickSound();
      triggerHaptic();
      togglePlay();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      playClickSound();
      triggerHaptic();
      nextTrack();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      playClickSound();
      triggerHaptic();
      prevTrack();
    });

    // Inicialización
    renderScreen();
  </script>
</body>
</html>
