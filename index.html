<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPod Classic</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .casing-silver { background: linear-gradient(145deg, #e6e6e6, #cccccc); }
    .casing-black  { background: linear-gradient(145deg, #2a2a2a, #141414); }
    .wheel-shadow { box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.3); }
    .lcd-screen { background: #e0e8f0; box-shadow: inset 0 0 10px rgba(0,0,0,0.15); }
    .menu-item-selected { background: linear-gradient(180deg, #3388e6 0%, #0055b3 100%); color: white; }
  </style>
</head>
<body>

  <!-- iPod Estructura -->
  <div id="ipod-case" class="casing-silver w-[340px] h-[580px] rounded-[38px] p-6 flex flex-col justify-between shadow-2xl relative border border-white/20">
    
    <!-- Pantalla -->
    <div class="lcd-screen w-full h-[240px] rounded-lg border-2 border-gray-400/50 overflow-hidden flex flex-col relative text-gray-800">
      <div class="h-7 bg-gradient-to-b from-gray-200 to-gray-300 border-b border-gray-400 flex items-center justify-between px-3 text-xs font-semibold">
        <span id="screen-title">iPod</span>
        <i class="fas fa-battery-three-quarters text-xs text-gray-700"></i>
      </div>
      <div id="screen-content" class="flex-1 overflow-y-auto p-2"></div>
    </div>

    <!-- Click Wheel -->
    <div class="flex justify-center my-2">
      <div class="w-[210px] h-[210px] rounded-full bg-white wheel-shadow relative flex items-center justify-center">
        <button id="btn-menu" class="absolute top-3 font-bold text-gray-600 text-xs p-2">MENU</button>
        <button id="btn-prev" class="absolute left-3 text-gray-600 text-xs p-3"><i class="fas fa-backward"></i></button>
        <button id="btn-next" class="absolute right-3 text-gray-600 text-xs p-3"><i class="fas fa-forward"></i></button>
        <button id="btn-play" class="absolute bottom-3 text-gray-600 text-xs p-2"><i class="fas fa-play"></i>/<i class="fas fa-pause"></i></button>
        
        <div id="btn-center" class="w-[75px] h-[75px] rounded-full bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-300 cursor-pointer active:scale-95 transition flex items-center justify-center">
          <span class="text-[10px] font-bold text-gray-500">SELECT</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      menuHistory: [],
      currentMenu: 'main',
      selectedIndex: 0,
      playlist: JSON.parse(localStorage.getItem('ipod_playlist')) || [
        { title: 'Billie Jean', artist: 'Michael Jackson', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { title: 'Starboy', artist: 'The Weeknd', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' }
      ],
      currentTrackIndex: -1,
      isPlaying: false,
      audio: new Audio()
    };

    const menus = {
      main: {
        title: 'iPod',
        items: [
          { label: 'Música', action: () => navigateTo('music') },
          { label: 'Añadir canción', action: () => navigateTo('addSong') },
          { label: 'Cambiar Color', action: () => toggleTheme() }
        ]
      },
      music: { title: 'Música', items: [] }
    };

    function toggleTheme() {
      const casing = document.getElementById('ipod-case');
      if (casing.classList.contains('casing-silver')) {
        casing.className = casing.className.replace('casing-silver', 'casing-black');
      } else {
        casing.className = casing.className.replace('casing-black', 'casing-silver');
      }
    }

    function navigateTo(menuKey) {
      if (menuKey === 'addSong') {
        renderAddSong();
        return;
      }
      state.menuHistory.push({ menu: state.currentMenu, index: state.selectedIndex });
      state.currentMenu = menuKey;
      state.selectedIndex = 0;
      renderScreen();
    }

    function goBack() {
      if (state.menuHistory.length > 0) {
        const last = state.menuHistory.pop();
        state.currentMenu = last.menu;
        state.selectedIndex = last.index;
        renderScreen();
      }
    }

    function renderScreen() {
      if (state.currentMenu === 'nowPlaying') {
        renderNowPlaying();
      } else {
        renderMenu();
      }
    }

    function renderMenu() {
      const titleEl = document.getElementById('screen-title');
      const content = document.getElementById('screen-content');
      content.innerHTML = '';

      let items = menus[state.currentMenu] ? menus[state.currentMenu].items : [];

      if (state.currentMenu === 'music') {
        titleEl.innerText = 'Música';
        items = state.playlist.map((t, i) => ({
          label: `${t.title} - ${t.artist}`,
          action: () => playTrack(i)
        }));
      } else {
        titleEl.innerText = menus[state.currentMenu].title;
      }

      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `px-3 py-2 text-xs font-medium flex justify-between items-center rounded ${
          idx === state.selectedIndex ? 'menu-item-selected' : 'text-gray-800'
        }`;
        div.innerHTML = `<span>${item.label}</span><i class="fas fa-chevron-right text-[9px]"></i>`;
        content.appendChild(div);
      });
    }

    function renderAddSong() {
      document.getElementById('screen-title').innerText = 'Añadir canción';
      const content = document.getElementById('screen-content');
      content.innerHTML = `
        <div class="p-2 text-xs space-y-2">
          <p class="font-bold">Título:</p>
          <input type="text" id="in-title" class="w-full p-1 border rounded text-xs bg-white text-black" placeholder="Ej. Canción">
          <p class="font-bold">Artista:</p>
          <input type="text" id="in-artist" class="w-full p-1 border rounded text-xs bg-white text-black" placeholder="Ej. Artista">
          <p class="font-bold">Enlace MP3 directo:</p>
          <input type="text" id="in-url" class="w-full p-1 border rounded text-xs bg-white text-black" placeholder="https://...mp3">
          <button id="btn-save" class="w-full bg-blue-600 text-white py-1.5 rounded font-bold mt-1">Guardar</button>
        </div>
      `;
      setTimeout(() => {
        document.getElementById('btn-save').onclick = () => {
          const t = document.getElementById('in-title').value.trim();
          const a = document.getElementById('in-artist').value.trim();
          const u = document.getElementById('in-url').value.trim();
          if (t && a && u) {
            state.playlist.push({ title: t, artist: a, url: u });
            localStorage.setItem('ipod_playlist', JSON.stringify(state.playlist));
            alert('¡Guardada con éxito!');
            navigateTo('music');
          } else {
            alert('Rellena todos los campos.');
          }
        };
      }, 50);
    }

    function playTrack(index) {
      if (!state.playlist.length) return;
      if (index < 0) index = state.playlist.length - 1;
      if (index >= state.playlist.length) index = 0;
      state.currentTrackIndex = index;
      const track = state.playlist[index];

      state.audio.src = track.url;
      state.audio.play().then(() => {
        state.isPlaying = true;
      }).catch(e => alert("Error al reproducir el audio. Comprueba que el enlace MP3 sea directo."));

      navigateTo('nowPlaying');
    }

    function renderNowPlaying() {
      document.getElementById('screen-title').innerText = 'Reproduciendo';
      const content = document.getElementById('screen-content');
      const track = state.playlist[state.currentTrackIndex] || { title: 'Nada', artist: '' };
      content.innerHTML = `
        <div class="p-3 flex flex-col items-center justify-center h-full text-center space-y-3">
          <div class="w-16 h-16 bg-gradient-to-tr from-gray-400 to-gray-200 rounded shadow flex items-center justify-center">
            <i class="fas fa-music text-2xl text-gray-600"></i>
          </div>
          <p class="font-bold text-xs truncate w-full text-black">${track.title}</p>
          <p class="text-[11px] text-gray-600 truncate w-full">${track.artist}</p>
          <p class="text-[10px] text-blue-600 font-semibold">${state.isPlaying ? '▶ Reproduciendo...' en : '⏸ En pausa'}</p>
        </div>
      `;
    }

    // --- CONTROLES ---
    function moveSelection(dir) {
      const itemsCount = state.currentMenu === 'music' ? state.playlist.length : menus[state.currentMenu].items.length;
      if (itemsCount === 0) return;
      state.selectedIndex += dir;
      if (state.selectedIndex < 0) state.selectedIndex = itemsCount - 1;
      if (state.selectedIndex >= itemsCount) state.selectedIndex = 0;
      renderScreen();
    }

    document.getElementById('btn-menu').onclick = () => goBack();
    document.getElementById('btn-next').onclick = () => moveSelection(1);
    document.getElementById('btn-prev').onclick = () => moveSelection(-1);
    document.getElementById('btn-play').onclick = () => {
      if (state.audio.paused) {
        state.audio.play();
        state.isPlaying = true;
      } else {
        state.audio.pause();
        state.isPlaying = false;
      }
      if (state.currentMenu === 'nowPlaying') renderNowPlaying();
    };

    document.getElementById('btn-center').onclick = () => {
      if (state.currentMenu === 'music') {
        playTrack(state.selectedIndex);
      } else {
        const menu = menus[state.currentMenu];
        if (menu && menu.items[state.selectedIndex]) {
          menu.items[state.selectedIndex].action();
        }
      }
    };

    renderScreen();
  </script>
</body>
</html>
